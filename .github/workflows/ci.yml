name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit
      - name: Audit dependencies (non-blocking)
        continue-on-error: true
        run: npm audit --json --audit-level=high | tee "$RUNNER_TEMP/npm-audit.json"
      - name: Summarize high and critical vulnerabilities (non-blocking)
        continue-on-error: true
        run: node scripts/summarize-audit.ts "$RUNNER_TEMP/npm-audit.json" >> "$GITHUB_STEP_SUMMARY"
      # Keep these steps aligned with the local verify script.
      - name: Lint
        run: npm run lint
      - name: Check guidance
        run: npm run check:guidance
      - name: Contract tests
        run: npm run test:contract
      - name: Unit tests
        run: npm run test:unit
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  # Publish the image only after verify passes on a push to main; pull requests and manual runs only verify.
  # Follows julie-ng/ai-native-sdlc-agent-images (.github/workflows/publish.yml).
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The federated credential's subject is this repository's production environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
    steps:
      - uses: actions/checkout@v7
      - name: Build AMD64 image
        run: docker build --platform linux/amd64 -t platform-services:check .
      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Push image
        run: |
          set -euo pipefail
          az acr login --name "$AZURE_ACR_NAME"
          image="$AZURE_ACR_NAME.azurecr.io/platform-services"
          docker tag platform-services:check "$image:sha-$GITHUB_SHA"
          docker tag platform-services:check "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
