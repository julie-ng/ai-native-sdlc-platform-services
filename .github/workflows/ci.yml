name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit
      - name: Audit dependencies (non-blocking)
        continue-on-error: true
        run: npm audit --json --audit-level=high | tee "$RUNNER_TEMP/npm-audit.json"
      - name: Summarize high and critical vulnerabilities (non-blocking)
        continue-on-error: true
        run: node scripts/summarize-audit.ts "$RUNNER_TEMP/npm-audit.json" >> "$GITHUB_STEP_SUMMARY"
      # verify runs lint, guidance checks, and the production build once.
      - run: npm run verify
