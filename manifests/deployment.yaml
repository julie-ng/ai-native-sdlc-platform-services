---
# Apply with `make deploy`; see README "Deployment". ${...} values come from manifests/.env.
# Terraform owns the ServiceAccount (annotated for platform-services-mi); the infrastructure
# repository owns the SecretProviderClass platform-services-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-services
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-services
spec:
  # One replica: startup migrations are not coordinated across pods.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-services
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-services
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: platform-services
      nodeSelector:
        kubernetes.azure.com/agentpool: platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: platform-services
          image: ${AZURE_ACR_NAME}.azurecr.io/platform-services:latest
          # `latest` is republished on every push to main; roll out with `kubectl rollout restart`.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NUXT_DATABASE_ENTRA_AUTH
              value: "true"
            - name: NUXT_DATABASE_URL
              value: postgresql://platform-services-mi@${POSTGRES_SERVER}.postgres.database.azure.com:5432/workflow
            - name: NUXT_ARTIFACT_STORAGE_ACCOUNT_URL
              value: ${ARTIFACT_STORAGE_ACCOUNT_URL}
            - name: NUXT_ARTIFACT_STORAGE_CONTAINER
              value: ${ARTIFACT_STORAGE_CONTAINER}
            # 15 minutes is the deliberate default: a run that outlives its token fails instead of spending more.
            - name: NUXT_HMAC_TOKEN_EXPIRY_MINUTES
              value: "15"
          # NUXT_ADMIN_TOKEN and NUXT_HMAC_KEY are read from these files by the image entrypoint.
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: platform-services-secrets
